# Run from repo root: docker compose --env-file .env -f config/docker-compose.yml up -d --build

services:
  # Slack AI Bot
  slack-ai-bot:
    build: 
      context: ..
      dockerfile: Dockerfile
    container_name: slack-ai-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:${KIT_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    networks:
      - slack-bot-network
    healthcheck:
      test: ["CMD", "/slack-ai-bot", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for conversation memory and caching
  redis:
    image: redis:7-alpine
    container_name: slack-ai-bot-redis
    restart: unless-stopped
    # Kit currently stores conversations in memory; Redis is optional tooling.
    profiles:
      - debug
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ../config/redis.conf:/etc/redis/redis.conf:ro
    command: redis-server /etc/redis/redis.conf
    networks:
      - slack-bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional: Redis Commander for debugging
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: slack-ai-bot-redis-ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - slack-bot-network
    profiles:
      - debug

volumes:
  redis_data:
    driver: local

networks:
  slack-bot-network:
    driver: bridge
